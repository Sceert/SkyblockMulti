plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Jared's Maven"
        url = "https://maven.blamejared.com/"
    }

    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Optional compile-time integration. JEI is not bundled or required at runtime.
    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
    runtimeOnly "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"

    compileOnly "maven.modrinth:gF3BGWvG:tdvSCMV3"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs += ['-Xlint:deprecation']
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.register('verifyTreeConfig', JavaExec) {
    group = 'verification'
    description = 'Verifies stable tree IDs and legacy configuration migration.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cl.treecs.skyblockmulti.tree.TreeConfigVerification'
}

tasks.register('verifyInfernalDataApi', JavaExec) {
    group = 'verification'
    description = 'Verifies Infernal Trial datapack schema parsing and safety limits.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cl.treecs.skyblockmulti.infernal.InfernalDataApiVerification'
}

// Las verificaciones actuales son ejecutables Java sin dependencia de JUnit.
test.failOnNoDiscoveredTests = false
check.dependsOn verifyTreeConfig
check.dependsOn verifyInfernalDataApi
